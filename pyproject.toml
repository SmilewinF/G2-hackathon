[project]
name = "novelty"
version = "0.1.0"
description = "Reward novel-but-relevant user generated content on a [0, 1] scale"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastembed>=0.4",
    "pyspellchecker>=0.8",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["novelty", "novelty.signals"]

[tool.setuptools.package-data]
novelty = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The held-out TEST split is reported, never tuned on: its checks run only when asked for
# (pytest -m heldout_test). A later -m on the command line replaces this one.
addopts = "-m 'not heldout_test'"
markers = ["heldout_test: aggregate checks on the held-out test split (report only; deselected by default)"]
